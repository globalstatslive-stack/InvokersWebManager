name: Desplegar en GitHub Pages

# Compila y publica dist/ en la rama gh-pages, que es la fuente configurada de GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # La actualización semanal de datos la llama tras confirmar en main (un push con GITHUB_TOKEN no dispara workflows).
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Empaquetar la extensión de Chrome
        run: cd extension && zip -r ../dist/nexo-extension.zip . -x '*.DS_Store'
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          commit_message: 'Publicar ${{ github.sha }}'
